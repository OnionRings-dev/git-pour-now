name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Validate release tag and branch ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(go run ./scripts/release-version "$TAG")
          [[ "$TAG" == "v$version" ]]
          core=${version%%+*}
          if [[ "$core" == *-* ]]; then
            core=${core%%-*}
            git merge-base --is-ancestor "$GITHUB_SHA" "origin/prerelease/$core"
          else
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          fi
      - name: Build and package
        env:
          TAG: ${{ github.ref_name }}
        run: bash ./scripts/build.sh "$TAG"
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s failglob
          args=(--verify-tag --title "$TAG" --generate-notes)
          if [[ "${TAG%%+*}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            "${args[@]}" dist/*.tar.gz dist/*.zip dist/*-checksums.txt
